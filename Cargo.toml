[package]
name = "halo-bridge"
version = "0.4.8"
edition = "2024"
description = "Halo Core Identity Provider, Multi-factor Authentication & OIDC Protocol Engine"
license = "Apache-2.0"
repository = "https://github.com/halo-space/bridge"
readme = "README.md"
keywords = ["identity", "authentication", "oidc", "webauthn", "mfa"]
categories = ["authentication", "web-programming"]

[lib]
name = "halo"

[features]
default = ["full"]
full = ["mail", "sms", "social", "enterprise", "passkey"]
mail = ["dep:lettre"]
sms = ["dep:reqwest"]
social = ["dep:reqwest"]
enterprise = ["dep:reqwest", "dep:ldap3", "dep:saml"]
passkey = ["dep:webauthn-rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
jsonwebtoken = "9.3"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
url = "2.5"
tracing = "0.1"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
lettre = { version = "0.11.23", optional = true, default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["json", "form", "rustls"] }
ldap3 = { version = "0.12.1", optional = true, default-features = false, features = ["tls-rustls-ring"] }
saml = { version = "0.1.0-alpha.1", optional = true, default-features = false, features = ["rsa-sha", "ecdsa-sha"] }
webauthn-rs = { version = "0.6.2", optional = true, features = ["danger-allow-state-serialisation"] }
bcrypt = "0.17"
pbkdf2 = { version = "0.12", features = ["simple"] }
sm3 = "0.4"
digest = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "pipeline"
harness = false

[[test]]
name = "idp_tests"
required-features = ["full"]

[[test]]
name = "pipeline_services"
required-features = ["full"]

[[test]]
name = "provider_errors"
required-features = ["social", "enterprise"]

[[test]]
name = "saml_tests"
required-features = ["enterprise"]

[[example]]
name = "sender_custom"
required-features = ["sms"]
